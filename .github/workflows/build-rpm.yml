name: Reusable Sailfish RPM build
on:
  workflow_call:
    secrets:
      BUILD_ENV_READ_TOKEN:
        description: Read-only token for checking out this private build recipe
        required: true
    inputs:
      recipe-ref:
        description: Full commit SHA of sfos-build-env (match the workflow uses ref)
        required: true
        type: string
      architecture:
        default: aarch64
        type: string
      target:
        default: SailfishOS-5.1.0.11-aarch64
        type: string
      allow-unverified-target:
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, sfos-sdk]
    environment: sfos-build
    timeout-minutes: 60
    concurrency:
      group: sfos-build-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Validate recipe pin
        env:
          RECIPE_REF: ${{ inputs.recipe-ref }}
        run: '[[ "$RECIPE_REF" =~ ^[0-9a-f]{40}$ ]]'
        shell: bash
      - name: Check out calling application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: application
          persist-credentials: false
      - name: Check out build recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: imaxeon-anik/sfos-build-env
          ref: ${{ inputs.recipe-ref }}
          path: build-env
          token: ${{ secrets.BUILD_ENV_READ_TOKEN }}
          persist-credentials: false
      - name: Check SDK
        run: bash build-env/scripts/doctor.sh
      - name: Build RPM
        env:
          ARCH: ${{ inputs.architecture }}
          SFOS_TARGET: ${{ inputs.target }}
          SFOS_ALLOW_UNVERIFIED_TARGET: ${{ inputs.allow-unverified-target && '1' || '0' }}
        run: bash build-env/scripts/build.sh "$GITHUB_WORKSPACE/application" "$ARCH" "$GITHUB_WORKSPACE/out"
      - name: Upload packages and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sailfish-rpm-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: warn
          retention-days: 14